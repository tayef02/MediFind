<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Medicine - MediFind</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav id="nav" class="navbar"></nav>

  <main class="container">
    <h1>Find medicine</h1>

    <form id="search-form" class="search-bar">
      <input id="q" placeholder="Medicine or generic name, e.g. Napa or Paracetamol" required minlength="2">
      <button class="btn btn-primary" type="submit">Search</button>
    </form>

    <p id="status" class="muted">Search by brand name or generic name. The cheapest pharmacy is shown first.</p>
    <div id="results"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/user-search.js"></script>
</body>
</html>
