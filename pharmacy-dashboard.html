<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - MediFind</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav id="nav" class="navbar"></nav>

  <main class="container">
    <h1>Hello, <span id="hello"></span></h1>
    <div class="stats" id="overview"></div>

    <h2 class="section-title">Sales and profit</h2>
    <div class="stats" id="sales"></div>

    <h2 class="section-title">Stock value</h2>
    <div class="stats" id="stock-value"></div>

    <div class="two-col">
      <div class="card">
        <h2>Top selling medicines</h2>
        <div class="table-wrap">
          <table class="table">
            <thead><tr><th>Medicine</th><th>Sold</th><th>Sales</th><th>Profit</th></tr></thead>
            <tbody id="top-body"></tbody>
          </table>
        </div>
      </div>
      <div class="card">
        <h2>Low stock</h2>
        <ul class="simple-list" id="low-list"></ul>
      </div>
    </div>
    <div class="two-col">
      <div class="card">
        <h2>Expiring soon</h2>
        <ul class="simple-list" id="exp-list"></ul>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pharmacy-dashboard.js"></script>
</body>
</html>
