<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - MediFind</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

  <div class="auth-card">
    <a href="index.html" class="brand">MediFind</a>
    <h1>Create account</h1>

    <form id="reg-form">
      <div class="role-picker">
        <label>
          <input type="radio" name="role" value="user" checked>
          <span>User<small>Find and order medicine</small></span>
        </label>
        <label>
          <input type="radio" name="role" value="pharmacy">
          <span>Pharmacy<small>Manage stock and orders</small></span>
        </label>
      </div>

      <label>Full name <input name="full_name" required></label>

      <div id="pharmacy-fields" class="hidden">
        <label>Pharmacy name <input name="pharmacy_name"></label>
        <label>License no <input name="license_no"></label>
      </div>

      <label>Email <input type="email" name="email" required></label>
      <label>Phone
        <input name="phone" required pattern="01[0-9]{9}" title="11 digit number, e.g. 01712345678" placeholder="01XXXXXXXXX">
      </label>
      <label><span id="addr-label">Address</span> <textarea name="address" rows="2" required></textarea></label>
      <label>Password <input type="password" name="password" minlength="6" required></label>
      <label>Confirm password <input type="password" name="password2" minlength="6" required></label>

      <button class="btn btn-primary btn-block" type="submit">Register</button>
      <p class="muted center">Already have an account? <a href="login.html">Login</a></p>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script src="register.js"></script>
</body>
</html>
